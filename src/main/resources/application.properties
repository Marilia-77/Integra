spring.application.name=Integra
spring.profiles.active=dev

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/integra?useSSL=false&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=false

integra.jwt.secret=${JWT_SECRET}
integra.jwt.expiration-ms=28800000

nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.model=openai/gpt-oss-20b

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

logging.level.com.integra=DEBUG